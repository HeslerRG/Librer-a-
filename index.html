<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c16">
<title>Mi librería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --night:#0d0c16; --night-2:#171428; --night-3:#211c38;
  --paper:#f2e8d5; --ink:#ebe3d3; --mist:#9c97b8;
  --candle:#e9b872; --candle-2:#f6d59a; --wine:#7d2b3a;
  --wood-1:#7a4a2c; --wood-2:#4a2c1c; --wood-3:#26150d;
  --display:'Cormorant Garamond','Cormorant',Garamond,Georgia,serif;
  --ui:'Jost','Futura',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--night);scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:var(--ui);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--candle);outline-offset:3px}

/* ---------- fondo ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(1100px 700px at 50% -15%,rgba(233,184,114,.13),transparent 60%),
  radial-gradient(800px 600px at -10% 110%,rgba(125,43,58,.25),transparent 60%),
  radial-gradient(700px 500px at 110% 70%,rgba(60,50,120,.22),transparent 60%),
  radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%),
  var(--night)}
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;
  background:radial-gradient(520px circle at var(--mx,50%) var(--my,30%),rgba(233,184,114,.08),transparent 60%)}
@media (pointer:fine){#glow{display:block}}

/* ---------- barra superior ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:15;display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;pointer-events:none}
.top>*{pointer-events:auto}
.mark{font-family:var(--display);font-size:1.7rem;line-height:1;color:var(--candle);text-decoration:none;opacity:.85}
.top-actions{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(13,12,22,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(233,184,114,.22);border-radius:999px;padding:8px 14px;font-size:.82rem;color:var(--ink);transition:border-color .3s}
.pill:hover{border-color:var(--candle)}
.pill svg{width:16px;height:16px}
.pill.icon{padding:8px 10px}

/* ---------- portada ---------- */
.hero{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:100px 22px 90px;text-align:center}
.hero::before{content:"";position:absolute;left:50%;top:50%;width:min(900px,150vw);height:min(620px,90vh);transform:translate(-50%,-55%);
  background:radial-gradient(closest-side,rgba(233,184,114,.17),transparent);animation:flicker 5s infinite;pointer-events:none;z-index:-1}
@keyframes flicker{0%,100%{opacity:.85}12%{opacity:1}20%{opacity:.72}33%{opacity:.96}47%{opacity:.8}60%{opacity:1}75%{opacity:.7}88%{opacity:.93}}
.hero-inner{max-width:780px;will-change:transform,opacity}
.verse{font-family:var(--display);font-style:italic;font-size:clamp(1.2rem,3.8vw,1.65rem);line-height:1.55;color:var(--mist);
  min-height:4.7em;margin:0 0 14px}
.verse .ln{display:block}
.caret{display:inline-block;width:1px;height:1.05em;background:var(--candle);vertical-align:-.15em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.title{font-family:var(--display);font-weight:500;font-size:clamp(3.4rem,14vw,7.8rem);line-height:.95;margin:0;letter-spacing:-.015em;color:var(--paper)}
.title .ch{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(.28em)}
.lit .title .ch{animation:ink 1.2s var(--ease) forwards;animation-delay:calc(var(--i) * 75ms)}
@keyframes ink{to{opacity:1;filter:blur(0);transform:none;text-shadow:0 0 42px rgba(233,184,114,.32)}}
.flourish{display:block;width:min(360px,74vw);height:44px;margin:8px auto 0;overflow:visible}
.flourish path{fill:none;stroke:var(--candle);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900}
.flourish circle{fill:var(--candle);opacity:0}
.lit .flourish path{transition:stroke-dashoffset 2.4s var(--ease) .8s;stroke-dashoffset:0}
.lit .flourish circle{transition:opacity .8s 2.6s;opacity:1}
.hero-count{margin:22px 0 0;color:var(--mist);font-size:.98rem;opacity:0;transform:translateY(8px)}
.cta{margin-top:28px;position:relative;overflow:hidden;background:transparent;border:1px solid var(--candle);color:var(--candle-2);
  padding:13px 30px;border-radius:999px;font-family:var(--display);font-style:italic;font-size:1.25rem;opacity:0;transform:translateY(8px)}
.cta::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 130%,rgba(233,184,114,.4),transparent 70%);opacity:0;transition:opacity .4s}
.cta:hover::before{opacity:1}
.lit .hero-count,.lit .cta{transition:opacity 1s ease 1.5s,transform 1s var(--ease) 1.5s;opacity:1;transform:none}
.scroll-hint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;width:1px;height:48px;overflow:hidden;
  background:linear-gradient(transparent,rgba(233,184,114,.5));opacity:0}
.lit .scroll-hint{opacity:1;transition:opacity 1s 2.4s}
.scroll-hint span{position:absolute;left:-1px;top:-16px;width:3px;height:16px;border-radius:2px;background:var(--candle-2);animation:drip 2.3s ease-in infinite}
@keyframes drip{to{top:100%}}

/* ---------- biblioteca ---------- */
.library{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:30px 14px 70px}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;padding:0 6px}
.lib-head h2{font-family:var(--display);font-weight:500;font-style:italic;font-size:clamp(2.2rem,7vw,3rem);line-height:1;margin:0;color:var(--paper)}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mist);pointer-events:none}
.search input{width:100%;background:rgba(23,20,40,.72);border:1px solid rgba(233,184,114,.2);border-radius:999px;padding:11px 16px 11px 40px;
  color:var(--ink);font:inherit;font-size:.92rem;-webkit-appearance:none;appearance:none}
.search input:focus{outline:none;border-color:var(--candle);box-shadow:0 0 0 3px rgba(233,184,114,.14)}
.search input::placeholder{color:var(--mist)}
.plaques{display:flex;flex-wrap:wrap;gap:8px;padding:0 6px;margin-bottom:16px}
.plaque{display:inline-flex;align-items:baseline;gap:7px;border:1px solid rgba(233,184,114,.32);border-radius:6px;padding:6px 14px;
  background:linear-gradient(180deg,rgba(233,184,114,.12),rgba(233,184,114,.03));font-family:var(--display);font-style:italic;font-size:1.1rem;color:var(--candle-2);transition:background .3s,color .3s}
.plaque .n{font-family:var(--ui);font-style:normal;font-size:.7rem;opacity:.7}
.plaque[aria-pressed="true"]{background:linear-gradient(180deg,var(--candle-2),var(--candle));color:#2a1a08;border-color:var(--candle)}
.owner-bar{display:flex;justify-content:flex-end;padding:0 6px;margin-bottom:16px}

.bookcase{position:relative;padding:28px 14px 6px;border-radius:16px 16px 6px 6px;
  background:radial-gradient(120% 55% at 50% 0%,rgba(233,184,114,.11),transparent 70%),linear-gradient(180deg,#1c1526,#120d18);
  border:1px solid rgba(233,184,114,.1);box-shadow:inset 0 0 70px rgba(0,0,0,.65),0 34px 70px rgba(0,0,0,.5)}
.row{margin-bottom:34px}
.row-books,.row-labels{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));column-gap:var(--gap,16px);padding:0 4px}
.row-books{align-items:end}
.plank{position:relative;height:16px;margin:0 -14px;border-radius:2px;
  background:linear-gradient(180deg,var(--wood-1) 0%,var(--wood-2) 45%,var(--wood-3) 100%);
  box-shadow:0 14px 24px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,214,170,.3)}
.plank::after{content:"";position:absolute;left:0;right:0;top:100%;height:8px;background:linear-gradient(rgba(0,0,0,.45),transparent)}
.row-labels{padding-top:12px}

/* libro 3D */
.book{--t:14px;position:relative;display:block;width:100%;max-width:150px;justify-self:center;aspect-ratio:2/3;padding:0;border:0;background:none;
  perspective:900px;-webkit-tap-highlight-color:transparent}
.book-3d{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.face{position:absolute;display:block}
.front{inset:0;transform:translateZ(calc(var(--t) / 2));border-radius:2px 5px 5px 2px;overflow:hidden;background:var(--night-3);
  box-shadow:0 0 0 1px rgba(0,0,0,.45);transition:box-shadow .6s}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.front::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.45) 0,rgba(255,255,255,.15) 2.5%,rgba(0,0,0,.1) 5%,transparent 11%,transparent 86%,rgba(255,255,255,.06) 100%)}
.spine{top:0;left:0;width:var(--t);height:100%;transform-origin:left center;transform:translateZ(calc(var(--t) / -2)) rotateY(-90deg);
  background:linear-gradient(90deg,#2a0f17,#5a2131 50%,#2a0f17)}
.spine-t{position:absolute;inset:8px 0;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;
  overflow:hidden;white-space:nowrap;font-family:var(--display);font-style:italic;font-size:9px;color:var(--candle-2);opacity:.85}
.pages{top:3px;right:0;width:var(--t);height:calc(100% - 6px);transform-origin:right center;transform:translateZ(calc(var(--t) / -2)) rotateY(90deg);
  background:repeating-linear-gradient(90deg,#efe3c9 0 1px,#cbbd9c 1px 2px)}
.book-shadow{position:absolute;left:6%;right:6%;bottom:-7px;height:14px;background:radial-gradient(ellipse at center,rgba(0,0,0,.75),transparent 70%);
  filter:blur(2px);transition:transform .6s var(--ease),opacity .6s}
@media (hover:hover){
  .book:hover .book-3d{transform:translateY(-12px) rotateY(28deg) rotateX(4deg)}
  .book:hover .front{box-shadow:0 0 36px rgba(233,184,114,.38),0 0 0 1px rgba(0,0,0,.45)}
  .book:hover .book-shadow{transform:scale(.78);opacity:.55}
}
.book:focus-visible .book-3d{transform:translateY(-12px) rotateY(28deg)}
.book:active .book-3d{transform:translateY(-6px) scale(.97)}

/* portada generada */
.gen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14% 10%;text-align:center}
.gen::before{content:"";position:absolute;inset:6%;border:1px solid rgba(246,213,154,.42);border-radius:2px}
.gen .orn{font-family:var(--display);color:var(--candle-2);font-size:1.1em;opacity:.85}
.gen .gt{font-family:var(--display);font-style:italic;color:var(--paper);font-size:clamp(.85rem,2.7vw,1.15rem);line-height:1.12;margin:.35em 0;overflow-wrap:anywhere}
.gen .ga{font-size:.58rem;color:rgba(242,232,213,.72);letter-spacing:.04em}

/* entrada de los libros */
.bookcase.waiting .book,.bookcase.waiting .label{opacity:0}
.bookcase.enter .book{animation:place 1s var(--ease) both;animation-delay:var(--d)}
.bookcase.enter .label{animation:rise .8s ease both;animation-delay:calc(var(--d) + 350ms)}
@keyframes place{0%{opacity:0;transform:translateY(-70px) rotate(-7deg)}55%{opacity:1;transform:translateY(6px) rotate(1.5deg)}78%{transform:translateY(-2px) rotate(-.5deg)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.ghost{width:100%;max-width:150px;justify-self:center;aspect-ratio:2/3;border-radius:3px;
  background:linear-gradient(100deg,rgba(255,255,255,.03) 30%,rgba(233,184,114,.09) 50%,rgba(255,255,255,.03) 70%);background-size:300% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

.label{text-align:center;min-width:0}
.label .t{font-family:var(--display);font-size:clamp(.98rem,2.9vw,1.12rem);line-height:1.15;color:var(--paper);margin:0;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.label .a{font-size:.72rem;color:var(--mist);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:8px}
.tool{width:28px;height:28px;border-radius:8px;border:1px solid rgba(233,184,114,.18);background:rgba(23,20,40,.85);display:grid;place-items:center;color:var(--ink);padding:0}
.tool:hover{border-color:var(--candle)}
.tool svg{width:14px;height:14px}
.tool.del{color:#e58779}

.empty{text-align:center;padding:40px 20px 34px}
.empty .orn{font-family:var(--display);font-size:2.6rem;color:var(--candle);line-height:1}
.empty h3{font-family:var(--display);font-style:italic;font-weight:500;font-size:1.8rem;margin:8px 0 6px;color:var(--paper)}
.empty p{color:var(--mist);margin:0;line-height:1.5}
.bookcase>.plank{margin-bottom:28px}

.foot{position:relative;z-index:1;text-align:center;padding:10px 0 calc(40px + env(safe-area-inset-bottom,0px));font-family:var(--display);color:var(--candle);font-size:1.6rem;opacity:.6}

/* ---------- botones y modales ---------- */
.btn{border-radius:999px;padding:11px 20px;font-weight:500;font-size:.9rem;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:16px;height:16px}
.btn.gold{background:linear-gradient(180deg,var(--candle-2),var(--candle));color:#2a1a08;border:0;box-shadow:0 8px 24px rgba(233,184,114,.2)}
.btn.line{background:transparent;border:1px solid rgba(233,184,114,.3);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(5,4,10,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.overlay.open{opacity:1;visibility:visible}
.modal{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:linear-gradient(180deg,#1d1931,#141123);border:1px solid rgba(233,184,114,.22);
  border-radius:18px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateY(18px) scale(.98);transition:transform .4s var(--ease)}
.overlay.open .modal{transform:none}
.modal h2{font-family:var(--display);font-style:italic;font-weight:500;font-size:1.9rem;margin:0 0 4px;color:var(--paper)}
.modal .lead{color:var(--mist);font-size:.88rem;margin:0 0 6px;line-height:1.45}
.f{display:block;font-size:.8rem;color:var(--mist);margin:14px 0 6px}
.modal input[type=text],.modal input[type=email],.modal input[type=password]{width:100%;background:rgba(10,9,18,.7);border:1px solid rgba(233,184,114,.18);
  border-radius:10px;padding:11px 13px;color:var(--ink);font:inherit}
.modal input:focus{outline:none;border-color:var(--candle);box-shadow:0 0 0 3px rgba(233,184,114,.15)}
.file{display:flex;align-items:center;gap:10px;border:1px dashed rgba(233,184,114,.32);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--mist);font-size:.85rem;transition:border-color .3s}
.file:hover{border-color:var(--candle)}
.file input{display:none}
.file svg{width:18px;height:18px;flex:none;color:var(--candle)}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions-row{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

/* ---------- lector ---------- */
.reader{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
  background:radial-gradient(900px 600px at 50% 35%,rgba(233,184,114,.1),transparent 70%),#0a0912;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
.reader.open{opacity:1;visibility:visible}
.r-top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 8px}
.r-title{flex:1;min-width:0;text-align:center}
.r-title b{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--paper)}
.r-title small{display:block;color:var(--mist);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid rgba(233,184,114,.2);background:rgba(23,20,40,.6);display:grid;place-items:center;color:var(--ink);padding:0}
.icon-btn:hover{border-color:var(--candle)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px}
.r-stage{position:relative;flex:1;min-height:0;overflow:auto;display:flex;padding:12px;-webkit-overflow-scrolling:touch}
.r-sheet{margin:auto;position:relative;background:var(--paper);border-radius:2px;box-shadow:0 22px 60px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.3);
  opacity:0;transition:opacity .5s}
.r-sheet.ready{opacity:1}
.r-sheet canvas{display:block}
.r-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--mist);
  font-family:var(--display);font-style:italic;font-size:1.2rem;pointer-events:none}
.flame{width:12px;height:20px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 75%,#fff6d8,var(--candle-2) 35%,#e08a3c 75%);
  box-shadow:0 0 24px 6px rgba(233,184,114,.45);animation:flame 1.2s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes flame{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.04,.94) rotate(-1deg)}}
.r-bottom{display:flex;align-items:center;gap:12px;padding:8px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.r-progress{flex:1;height:2px;background:rgba(233,184,114,.15);border-radius:2px;overflow:hidden}
.r-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--candle),var(--candle-2));transition:width .5s var(--ease)}
.r-page{font-family:var(--display);font-size:1.1rem;color:var(--paper);min-width:62px;text-align:center}

/* libro volando al abrir */
.fly{position:fixed;z-index:35;pointer-events:none;transform-origin:center}
.fly::before{content:"";position:absolute;inset:0;background:var(--paper);border-radius:2px 5px 5px 2px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.fly-leaf{position:absolute;inset:0;transform-origin:left center;border-radius:2px 5px 5px 2px;overflow:hidden;backface-visibility:hidden;background:var(--night-3)}
.fly-leaf img{width:100%;height:100%;object-fit:cover;display:block}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:rgba(20,17,35,.96);border:1px solid rgba(233,184,114,.4);color:var(--ink);padding:11px 18px;border-radius:999px;font-size:.88rem;
  max-width:90vw;text-align:center;transition:opacity .3s,transform .35s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:#e58779}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .title .ch{opacity:1;filter:none;transform:none}
}
</style>
</head>
<body>

<div id="sky" aria-hidden="true"></div>
<canvas id="ambient" aria-hidden="true"></canvas>
<div id="glow" aria-hidden="true"></div>

<div class="top">
  <a class="mark" href="#hero" aria-label="Ir al inicio">❦</a>
  <div class="top-actions">
    <button class="pill" id="shareLib" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      Compartir
    </button>

<script>
/* ===================== Personaliza aquí ===================== */
const TITULO = 'Mi librería';
const VERSOS_PORTADA = [
  'Aquí duermen las palabras que no supe decir en voz alta.',
  'Pasa despacio: algunas todavía arden.'
];
const PALABRAS = ['verso','luna','silencio','alma','tinta','madrugada','olvido','suspiro','corazón',
  'ceniza','deseo','nostalgia','herida','eterno','poema','te pienso','lluvia','abrazo'];
/* ============================================================ */

const SUPABASE_URL = 'https://yvhlqwaglphndafftyrc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qlx3etQyyZpMe4Kl_Gsh5g_lC3AAanj';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = id => document.getElementById(id);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pubUrl = (bucket, path) => sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
const baseUrl = () => location.origin + location.pathname;

const S = { books: [], filter: 'Todos', q: '', user: null, coverTarget: null, editing: null, loaded: false };

const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  key:   svg('<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7M17 6l2.5 2.5M14.5 8.5 17 11"/>'),
  edit:  svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  image: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>'),
  down:  svg('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>'),
  trash: svg('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>')
};

const PALETTES = [['#5c1f2c','#250c13'],['#2b2a5e','#111027'],['#1f4236','#0c1c17'],['#4b2352','#1b0c1f'],['#1d3a57','#0b1724'],['#5a3a1c','#22150a']];
function pal(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return PALETTES[Math.abs(h) % PALETTES.length]; }

function toast(msg, err){
  const t = $('toast'); t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', 3800);
}
function niceError(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/maximum allowed size|exceeded|too large/i.test(m)) return 'El archivo es muy pesado. El plan gratis permite hasta 50 MB.';
  if (/row-level security|violates|not authorized|jwt/i.test(m)) return 'No tienes permiso. Inicia sesión de nuevo.';
  if (/invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  return 'Algo falló: ' + m;
}

/* ===================== portada animada ===================== */
let skipTyping = reduced;
function splitTitle(){
  const h = $('title'); h.setAttribute('aria-label', TITULO); h.textContent = '';
  [...TITULO].forEach((ch, i) => {
    const s = el('span', 'ch'); s.style.setProperty('--i', i); s.setAttribute('aria-hidden', 'true');
    s.textContent = ch === ' ' ? '\u00A0' : ch; h.appendChild(s);
  });
  document.title = TITULO;
}
async function typeVerse(){
  const box = $('verse'); box.setAttribute('aria-label', VERSOS_PORTADA.join(' ')); box.textContent = '';
  const caret = el('span', 'caret');
  for (const line of VERSOS_PORTADA){
    const ln = el('span', 'ln'); ln.setAttribute('aria-hidden', 'true');
    const txt = document.createTextNode('');
    ln.append(txt, caret); box.appendChild(ln);
    for (const ch of line){
      if (skipTyping){ txt.data = line; break; }
      txt.data += ch;
      await sleep(/[,.:;]/.test(ch) ? 280 : 34 + Math.random() * 42);
    }
    if (!skipTyping) await sleep(420);
  }
}
$('hero').addEventListener('click', e => { if (!e.target.closest('button,a')) skipTyping = true; });
$('openShelf').onclick = () => $('library').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' });

let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const y = scrollY, p = Math.min(1, y / (innerHeight * .75)), hi = $('heroInner');
    hi.style.opacity = String(1 - p);
    if (!reduced) hi.style.transform = `translateY(${y * .25}px)`;
    ticking = false;
  });
}, { passive: true });

if (matchMedia('(pointer:fine)').matches){
  const g = $('glow');
  addEventListener('pointermove', e => { g.style.setProperty('--mx', e.clientX + 'px'); g.style.setProperty('--my', e.clientY + 'px'); }, { passive: true });
}

/* ===================== palabras flotantes ===================== */
const Amb = { c: null, x: null, w: 0, h: 0, motes: [], words: [], pool: [...PALABRAS], running: false, raf: 0 };
function ambResize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  Amb.w = innerWidth; Amb.h = innerHeight;
  Amb.c.width = Amb.w * dpr; Amb.c.height = Amb.h * dpr;
  Amb.c.style.width = Amb.w + 'px'; Amb.c.style.height = Amb.h + 'px';
  Amb.x.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (reduced) ambDraw(0);
}
function newMote(init){
  return { x: rand(0, Amb.w), y: init ? rand(0, Amb.h) : Amb.h + 10, r: rand(.4, 1.7), vy: rand(-.28, -.05), vx: rand(-.08, .08), ph: rand(0, 6.28), sp: rand(.6, 1.6) };
}
function newWord(init){
  return {
    text: Amb.pool[Math.floor(Math.random() * Amb.pool.length)],
    x: rand(.06, .94) * Amb.w, y: init ? rand(.1, 1) * Amb.h : Amb.h + rand(20, 140),
    vy: rand(-.34, -.12), size: rand(15, Amb.w < 640 ? 27 : 40), amp: rand(8, 26), ph: rand(0, 6.28),
    max: rand(.06, .16), warm: Math.random() < .65
  };
}
function ambDraw(t){
  const ctx = Amb.x, w = Amb.w, h = Amb.h;
  ctx.clearRect(0, 0, w, h);
  for (const m of Amb.motes){
    if (!reduced){ m.x += m.vx; m.y += m.vy; if (m.y < -10) Object.assign(m, newMote(false)); }
    const a = Math.max(0, .25 + .35 * Math.sin(t * .001 * m.sp + m.ph)) * .6;
    ctx.beginPath(); ctx.fillStyle = `rgba(246,213,154,${a})`; ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
  }
  ctx.textAlign = 'center';
  for (const wd of Amb.words){
    if (!reduced){ wd.y += wd.vy; if (wd.y < -40) Object.assign(wd, newWord(false)); }
    const life = Math.min(Math.max(wd.y / h, 0), 1);
    const a = wd.max * Math.sin(Math.PI * life);
    if (a <= .003) continue;
    ctx.font = `italic ${wd.size}px "Cormorant Garamond", Georgia, serif`;
    ctx.fillStyle = wd.warm ? `rgba(233,184,114,${a})` : `rgba(182,174,216,${a})`;
    ctx.fillText(wd.text, wd.x + Math.sin(t * .0004 + wd.ph) * wd.amp, wd.y);
  }
}
function ambStart(){
  if (Amb.running || reduced) return; Amb.running = true;
  const loop = t => { if (!Amb.running) return; ambDraw(t); Amb.raf = requestAnimationFrame(loop); };
  Amb.raf = requestAnimationFrame(loop);
}
function ambStop(){ Amb.running = false; cancelAnimationFrame(Amb.raf); }
function ambSync(){ (document.hidden || R.open) ? ambStop() : ambStart(); }
function ambInit(){
  Amb.c = $('ambient'); Amb.x = Amb.c.getContext('2d');
  ambResize(); addEventListener('resize', debounce(ambResize, 200));
  const small = innerWidth < 640;
  for (let i = 0; i < (small ? 36 : 70); i++) Amb.motes.push(newMote(true));
  for (let i = 0; i < (small ? 9 : 16); i++) Amb.words.push(newWord(true));
  document.addEventListener('visibilitychange', ambSync);
  reduced ? ambDraw(0) : ambStart();
}
function ambSetPool(){
  const titles = S.books.map(b => b.title).filter(t => t && t.length <= 26);
  Amb.pool = [...PALABRAS, ...titles, ...titles];
}

/* ===================== sesión ===================== */
async function initAuth(){
  const { data } = await sb.auth.getSession();
  setUser(data.session ? data.session.user : null);
  sb.auth.onAuthStateChange((_e, s) => setUser(s ? s.user : null));
}
function setUser(u){
  const changed = (S.user ? S.user.id : null) !== (u ? u.id : null);
  S.user = u;
  const a = $('authBtn');
  if (u){ a.textContent = 'Salir'; a.classList.remove('icon'); a.setAttribute('aria-label', 'Cerrar sesión'); }
  else { a.innerHTML = ICON.key; a.classList.add('icon'); a.setAttribute('aria-label', 'Iniciar sesión'); }
  $('ownerBar').hidden = !u;
  if (changed && S.loaded) renderShelf();
}
$('authBtn').onclick = async () => {
  if (S.user){ await sb.auth.signOut(); toast('Sesión cerrada'); }
  else { openOv('loginOv'); setTimeout(() => $('email').focus(), 250); }
};
$('loginGo').onclick = async () => {
  const email = $('email').value.trim(), password = $('pass').value;
  if (!email || !password) return toast('Escribe tu correo y tu contraseña', true);
  const btn = $('loginGo'); btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) return toast(niceError(error), true);
  closeOv('loginOv'); $('pass').value = ''; toast('Bienvenido a tu estante');
};
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginGo').click(); });

/* ===================== datos ===================== */
async function loadBooks(){
  const { data, error } = await sb.from('books').select('*').order('created_at', { ascending: false });
  if (error){ toast('No se pudieron cargar los libros: ' + error.message, true); S.books = []; }
  else S.books = data || [];
  S.loaded = true;
  ambSetPool(); renderCount(); renderPlaques(); renderShelf();
}
function renderCount(){
  const n = S.books.length;
  $('heroCount').textContent = n
    ? `${n} ${n === 1 ? 'título espera' : 'títulos esperan'} en el estante`
    : 'El estante espera su primer verso';
}
function renderPlaques(){
  const counts = {};
  S.books.forEach(b => { const c = b.collection || 'Libros'; counts[c] = (counts[c] || 0) + 1; });
  const names = Object.keys(counts);
  if (S.filter !== 'Todos' && !names.includes(S.filter)) S.filter = 'Todos';
  const box = $('plaques'); box.textContent = '';
  box.hidden = names.length < 2;
  if (!box.hidden){
    [['Todos', S.books.length], ...names.map(n => [n, counts[n]])].forEach(([n, c]) => {
      const b = el('button', 'plaque'); b.type = 'button';
      b.setAttribute('aria-pressed', String(n === S.filter));
      b.append(n); const s = el('span', 'n'); s.textContent = c; b.appendChild(s);
      b.onclick = () => { S.filter = n; renderPlaques(); renderShelf(); };
      box.appendChild(b);
    });
  }
  const dl = $('collList'); dl.textContent = '';
  names.forEach(n => { const o = el('option'); o.value = n; dl.appendChild(o); });
}

/* ===================== estante ===================== */
function visibleBooks(){
  const q = S.q.trim().toLowerCase();
  return S.books.filter(b =>
    (S.filter === 'Todos' || (b.collection || 'Libros') === S.filter) &&
    (!q || (b.title || '').toLowerCase().includes(q) || (b.author || '').toLowerCase().includes(q)));
}
function colsFor(w){ return w < 440 ? 3 : Math.max(3, Math.min(7, Math.floor(w / 170))); }

function genCover(b){
  const [a, z] = pal(b.title || '');
  const d = el('div', 'gen'); d.style.background = `linear-gradient(160deg, ${a}, ${z})`;
  const o = el('span', 'orn'); o.textContent = '❦'; d.appendChild(o);
  const t = el('span', 'gt'); t.textContent = b.title; d.appendChild(t);
  if (b.author){ const au = el('span', 'ga'); au.textContent = b.author; d.appendChild(au); }
  return d;
}
function bookEl(b, d){
  const btn = el('button', 'book'); btn.type = 'button';
  btn.style.setProperty('--d', d + 'ms'); btn.setAttribute('aria-label', 'Leer ' + b.title);
  const [a, z] = pal(b.title || '');
  const b3 = el('span', 'book-3d');
  const front = el('span', 'face front');
  if (b.cover_path){
    const img = new Image(); img.alt = ''; img.decoding = 'async'; img.src = pubUrl('covers', b.cover_path);
    img.onerror = () => { front.textContent = ''; front.appendChild(genCover(b)); };
    front.appendChild(img);
  } else front.appendChild(genCover(b));
  const spine = el('span', 'face spine'); spine.style.background = `linear-gradient(90deg, ${z}, ${a} 50%, ${z})`;
  const st = el('span', 'spine-t'); st.textContent = b.title; spine.appendChild(st);
  b3.append(spine, el('span', 'face pages'), front);
  btn.append(b3, el('span', 'book-shadow'));
  btn.onclick = () => openBook(b, btn);
  return btn;
}
function labelEl(b, d){
  const l = el('div', 'label'); l.style.setProperty('--d', d + 'ms');
  const t = el('p', 't'); t.textContent = b.title; l.appendChild(t);
  if (b.author){ const a = el('p', 'a'); a.textContent = b.author; l.appendChild(a); }
  if (S.user){
    const tools = el('div', 'tools');
    [['edit', 'Editar datos', () => openBookModal(b)],
     ['image', 'Cambiar portada', () => { S.coverTarget = b; $('coverPicker').click(); }],
     ['down', 'Descargar', () => downloadBook(b)],
     ['trash', 'Eliminar', () => deleteBook(b)]
    ].forEach(([ic, lab, fn]) => {
      const x = el('button', 'tool' + (ic === 'trash' ? ' del' : '')); x.type = 'button';
      x.innerHTML = ICON[ic]; x.title = lab; x.setAttribute('aria-label', lab + ': ' + b.title); x.onclick = fn;
      tools.appendChild(x);
    });
    l.appendChild(tools);
  }
  return l;
}
function renderShelf(){
  const box = $('bookcase'); box.textContent = '';
  const inner = box.clientWidth - 28, cols = colsFor(inner), gap = inner < 440 ? 12 : 22;
  if (!S.loaded){
    const row = el('div', 'row'); row.style.setProperty('--cols', cols); row.style.setProperty('--gap', gap + 'px');
    const rb = el('div', 'row-books'); for (let i = 0; i < cols; i++) rb.appendChild(el('div', 'ghost'));
    row.append(rb, el('div', 'plank')); box.appendChild(row); return;
  }
  const list = visibleBooks();
  if (!list.length){
    const e = el('div', 'empty');
    const o = el('div', 'orn'); o.textContent = '❦';
    const h = el('h3'); const p = el('p');
    if (S.books.length){ h.textContent = 'Nada por aquí'; p.textContent = 'Prueba con otra palabra o con otra colección.'; }
    else {
      h.textContent = 'El estante espera su primer verso';
      p.textContent = S.user ? 'Toca «Subir libro» para colocar tu primer PDF.' : 'Pronto habrá páginas aquí.';
    }
    e.append(o, h, p); box.append(e, el('div', 'plank')); return;
  }
  for (let i = 0; i < list.length; i += cols){
    const row = el('div', 'row'); row.style.setProperty('--cols', cols); row.style.setProperty('--gap', gap + 'px');
    const rb = el('div', 'row-books'), rl = el('div', 'row-labels');
    list.slice(i, i + cols).forEach((b, j) => {
      const d = Math.min((i + j) * 80, 1500);
      rb.appendChild(bookEl(b, d)); rl.appendChild(labelEl(b, d));
    });
    row.append(rb, el('div', 'plank'), rl); box.appendChild(row);
  }
}
$('q').addEventListener('input', e => { S.q = e.target.value; renderShelf(); });

const shelfIO = new IntersectionObserver(es => {
  if (!es.some(e => e.isIntersecting)) return;
  shelfIO.disconnect();
  const bc = $('bookcase'); bc.classList.remove('waiting');
  if (!reduced){ bc.classList.add('enter'); setTimeout(() => bc.classList.remove('enter'), 3400); }
}, { threshold: .12 });
shelfIO.observe($('bookcase'));

/* ===================== lector ===================== */
const R = { pdf: null, book: null, page: 1, zoom: 1, task: null, busy: false, open: false, token: 0 };
const ZOOMS = [1, 1.5, 2, 3];

async function flyIn(btn){
  const front = btn.querySelector('.front'), r = front.getBoundingClientRect();
  const fly = el('div', 'fly');
  Object.assign(fly.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  const leaf = el('div', 'fly-leaf'); leaf.innerHTML = front.innerHTML;
  fly.appendChild(leaf); document.body.appendChild(fly);
  const s = Math.min(innerWidth * .6, 280) / r.width;
  const dx = innerWidth / 2 - (r.left + r.width / 2), dy = innerHeight / 2 - (r.top + r.height / 2);
  await fly.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px,${dy}px) scale(${s})` }],
    { duration: 560, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }).finished;
  fly._pv = Math.round(r.width * 5);
  return fly;
}
function openFly(fly){
  const leaf = fly.firstChild, pv = fly._pv || 600;
  leaf.animate([{ transform: `perspective(${pv}px) rotateY(0deg)` }, { transform: `perspective(${pv}px) rotateY(-165deg)` }],
    { duration: 950, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' });
  fly.animate([{ opacity: 1 }, { opacity: 1, offset: .55 }, { opacity: 0 }], { duration: 1150, fill: 'forwards' })
    .finished.then(() => fly.remove()).catch(() => fly.remove());
}
function showReader(b){
  R.open = true; R.book = b; R.page = 1; R.zoom = 1; R.pdf = null;
  $('rTitle').textContent = b.title; $('rAuthor').textContent = b.author || '';
  $('rLoading').hidden = false; $('rLoadText').textContent = 'Abriendo el libro';
  const c = $('rCanvas'); c.width = 0; c.height = 0; c.style.width = '0px'; c.style.height = '0px';
  $('rSheet').classList.remove('ready');
  $('rPage').textContent = ''; $('rBar').style.width = '0';
  $('reader').classList.add('open'); $('reader').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  ambSync();
  try { const u = new URL(location.href); u.searchParams.set('libro', b.id); history.replaceState(null, '', u); } catch (_) {}
}
async function openBook(b, fromBtn){
  if (R.open) return;
  const token = ++R.token;
  let fly = null;
  if (fromBtn && !reduced){ try { fly = await flyIn(fromBtn); } catch (_) { fly = null; } }
  showReader(b);
  if (fly) openFly(fly);
  try {
    const pdf = await pdfjsLib.getDocument({ url: pubUrl('pdfs', b.pdf_path) }).promise;
    if (token !== R.token){ pdf.destroy(); return; }
    R.pdf = pdf;
    let saved = 1; try { saved = parseInt(localStorage.getItem('libro:' + b.id), 10) || 1; } catch (_) {}
    R.page = Math.min(Math.max(1, saved), pdf.numPages);
    await drawPage(R.page);
    if (token !== R.token) return;
    $('rLoading').hidden = true; $('rSheet').classList.add('ready'); updateBar();
  } catch (e) {
    if (token === R.token) $('rLoadText').textContent = 'No se pudo abrir este PDF.';
  }
}
async function drawPage(n){
  const page = await R.pdf.getPage(n);
  const stage = $('rStage'), base = page.getViewport({ scale: 1 });
  const w = stage.clientWidth - 24, h = stage.clientHeight - 24;
  const fit = h > w ? w / base.width : Math.min(w / base.width, h / base.height);
  const css = fit * R.zoom, dpr = Math.min(devicePixelRatio || 1, 2);
  const vp = page.getViewport({ scale: css * dpr });
  const off = document.createElement('canvas'); off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
  if (R.task){ try { R.task.cancel(); } catch (_) {} }
  const task = page.render({ canvasContext: off.getContext('2d'), viewport: vp });
  R.task = task;
  await task.promise;
  if (R.task === task) R.task = null;
  const c = $('rCanvas');
  c.width = off.width; c.height = off.height;
  c.style.width = Math.floor(base.width * css) + 'px'; c.style.height = Math.floor(base.height * css) + 'px';
  c.getContext('2d').drawImage(off, 0, 0);
}
function updateBar(){
  if (!R.pdf) return;
  const n = R.pdf.numPages;
  $('rPage').textContent = `${R.page} / ${n}`;
  $('rBar').style.width = (R.page / n * 100) + '%';
  $('rPrev').disabled = R.page <= 1; $('rNext').disabled = R.page >= n;
  $('rZoomOut').disabled = R.zoom <= ZOOMS[0]; $('rZoomIn').disabled = R.zoom >= ZOOMS[ZOOMS.length - 1];
}
function savePos(){ try { localStorage.setItem('libro:' + R.book.id, String(R.page)); } catch (_) {} }
async function turn(dir){
  if (!R.pdf || R.busy) return;
  const n = R.page + dir;
  if (n < 1 || n > R.pdf.numPages) return;
  R.busy = true;
  const sheet = $('rSheet'); let out = null;
  try {
    if (!reduced){
      sheet.style.transformOrigin = dir > 0 ? 'left center' : 'right center';
      out = sheet.animate([
        { transform: 'perspective(1600px) rotateY(0deg)', opacity: 1 },
        { transform: `perspective(1600px) rotateY(${dir > 0 ? -60 : 60}deg)`, opacity: 0 }
      ], { duration: 230, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
      await out.finished;
    }
    R.page = n;
    await drawPage(n);
    $('rStage').scrollTo(0, 0);
    updateBar(); savePos();
    if (!reduced){
      sheet.style.transformOrigin = dir > 0 ? 'right center' : 'left center';
      const inn = sheet.animate([
        { transform: `perspective(1600px) rotateY(${dir > 0 ? 60 : -60}deg)`, opacity: 0 },
        { transform: 'perspective(1600px) rotateY(0deg)', opacity: 1 }
      ], { duration: 340, easing: 'cubic-bezier(.2,.8,.2,1)' });
      if (out) out.cancel();
      await inn.finished;
    }
  } catch (_) {
    if (out) out.cancel();
  } finally { R.busy = false; }
}
async function setZoom(dir){
  if (!R.pdf) return;
  const i = ZOOMS.indexOf(R.zoom), j = Math.min(Math.max(i + dir, 0), ZOOMS.length - 1);
  if (i === j) return;
  R.zoom = ZOOMS[j];
  try { await drawPage(R.page); } catch (_) {}
  updateBar();
}
function closeReader(){
  R.token++; R.open = false;
  if (R.task){ try { R.task.cancel(); } catch (_) {} R.task = null; }
  if (R.pdf){ R.pdf.destroy(); R.pdf = null; }
  $('reader').classList.remove('open'); $('reader').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  ambSync();
  try { const u = new URL(location.href); u.searchParams.delete('libro'); history.replaceState(null, '', u); } catch (_) {}
}
$('rClose').onclick = closeReader;
$('rPrev').onclick = () => turn(-1);
$('rNext').onclick = () => turn(1);
$('rZoomIn').onclick = () => setZoom(1);
$('rZoomOut').onclick = () => setZoom(-1);
$('rShare').onclick = () => R.book && shareLink(baseUrl() + '?libro=' + R.book.id, R.book.title);

(() => {
  const st = $('rStage'); let sx = null, sy = 0, t0 = 0;
  st.addEventListener('touchstart', e => {
    if (e.touches.length !== 1){ sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  st.addEventListener('touchend', e => {
    if (sx === null || R.zoom !== 1) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3 && Date.now() - t0 < 700) turn(dx < 0 ? 1 : -1);
    sx = null;
  }, { passive: true });
  st.addEventListener('click', e => {
    if (R.zoom !== 1 || !R.pdf) return;
    const r = st.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    if (x < .28) turn(-1); else if (x > .72) turn(1);
  });
})();

/* ===================== compartir ===================== */
async function shareLink(url, title){
  try { if (navigator.share){ await navigator.share({ title, url }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('Enlace copiado'); }
  catch (_) { prompt('Copia este enlace:', url); }
}
$('shareLib').onclick = () => shareLink(baseUrl(), TITULO);

/* ===================== modales ===================== */
function openOv(id){ $(id).classList.add('open'); }
function closeOv(id){ $(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeOv(b.dataset.close));
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('mousedown', e => { if (e.target === o) o.classList.remove('open'); }));
document.addEventListener('keydown', e => {
  const open = [...document.querySelectorAll('.overlay.open')];
  if (e.key === 'Escape'){
    if (open.length){ open[open.length - 1].classList.remove('open'); return; }
    if (R.open) closeReader();
    return;
  }
  if (R.open && !open.length){
    if (e.key === 'ArrowRight') turn(1);
    if (e.key === 'ArrowLeft') turn(-1);
  }
});

/* ===================== subir y editar ===================== */
const PDF_HINT = 'Toca para elegir el PDF', COVER_HINT = 'Si no eliges una, se usa la primera página';
function openBookModal(b){
  S.editing = b || null;
  $('bookOvTitle').textContent = b ? 'Editar datos' : 'Subir libro';
  $('bookOvLead').textContent = b ? 'Cambia el título, el autor o la colección.' : 'Elige un PDF y dale un lugar en el estante.';
  $('fileFields').hidden = !!b;
  $('bookGo').textContent = b ? 'Guardar' : 'Subir';
  $('fTitle').value = b ? b.title : '';
  $('fAuthor').value = b ? (b.author || '') : '';
  $('fColl').value = b ? (b.collection || '') : (S.filter !== 'Todos' ? S.filter : '');
  $('fPdf').value = ''; $('fCover').value = '';
  $('fPdfName').textContent = PDF_HINT; $('fCoverName').textContent = COVER_HINT;
  openOv('bookOv');
}
$('uploadBtn').onclick = () => openBookModal(null);
$('fPdf').onchange = () => {
  const f = $('fPdf').files[0];
  $('fPdfName').textContent = f ? f.name : PDF_HINT;
  if (f && !$('fTitle').value.trim()) $('fTitle').value = f.name.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim();
};
$('fCover').onchange = () => { const f = $('fCover').files[0]; $('fCoverName').textContent = f ? f.name : COVER_HINT; };

async function coverFromPdf(file){
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  try {
    const page = await pdf.getPage(1), base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 600 / base.width });
    const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    return await new Promise(res => c.toBlob(res, 'image/jpeg', .86));
  } finally { pdf.destroy(); }
}
const extOf = f => ((f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg';

async function uploadBook({ title, author, collection, pdf, cover }){
  const id = crypto.randomUUID(), pdfPath = id + '.pdf';
  let coverPath = null;
  const up = await sb.storage.from('pdfs').upload(pdfPath, pdf, { contentType: 'application/pdf' });
  if (up.error) throw up.error;
  let blob = cover || null, type = cover ? (cover.type || 'image/jpeg') : 'image/jpeg', ext = cover ? extOf(cover) : 'jpg';
  if (!blob){ try { blob = await coverFromPdf(pdf); } catch (_) { blob = null; } }
  if (blob){
    coverPath = id + '.' + ext;
    const uc = await sb.storage.from('covers').upload(coverPath, blob, { contentType: type });
    if (uc.error) coverPath = null;
  }
  const { error } = await sb.from('books').insert({ title, author, collection, pdf_path: pdfPath, cover_path: coverPath });
  if (error){
    await sb.storage.from('pdfs').remove([pdfPath]);
    if (coverPath) await sb.storage.from('covers').remove([coverPath]);
    throw error;
  }
}
$('bookGo').onclick = async () => {
  const title = $('fTitle').value.trim();
  if (!title) return toast('Escribe un título', true);
  const author = $('fAuthor').value.trim() || null, collection = $('fColl').value.trim() || 'Libros';
  const btn = $('bookGo'), editing = S.editing;
  if (!editing && !$('fPdf').files[0]) return toast('Elige un archivo PDF', true);
  btn.disabled = true; btn.textContent = editing ? 'Guardando…' : 'Subiendo…';
  try {
    if (editing){
      const { error } = await sb.from('books').update({ title, author, collection }).eq('id', editing.id);
      if (error) throw error;
      closeOv('bookOv'); toast('Cambios guardados');
    } else {
      await uploadBook({ title, author, collection, pdf: $('fPdf').files[0], cover: $('fCover').files[0] });
      closeOv('bookOv'); toast('Libro subido');
    }
    await loadBooks();
  } catch (e) { toast(niceError(e), true); }
  finally { btn.disabled = false; btn.textContent = editing ? 'Guardar' : 'Subir'; }
};

/* ===================== portada, descargar, eliminar ===================== */
$('coverPicker').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  const b = S.coverTarget; S.coverTarget = null;
  if (!f || !b) return;
  try {
    toast('Cambiando la portada…');
    const path = crypto.randomUUID() + '.' + extOf(f);
    const u = await sb.storage.from('covers').upload(path, f, { contentType: f.type || 'image/jpeg' });
    if (u.error) throw u.error;
    const { error } = await sb.from('books').update({ cover_path: path }).eq('id', b.id);
    if (error) throw error;
    if (b.cover_path) await sb.storage.from('covers').remove([b.cover_path]);
    toast('Portada actualizada'); await loadBooks();
  } catch (err) { toast(niceError(err), true); }
};
async function downloadBook(b){
  try {
    toast('Preparando la descarga…');
    const r = await fetch(pubUrl('pdfs', b.pdf_path));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    const a = el('a'); a.href = url; a.download = (b.title || 'libro').replace(/[\\/:*?"<>|]/g, '') + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 6000);
  } catch (e) { toast('No se pudo descargar: ' + e.message, true); }
}
async function deleteBook(b){
  if (!confirm('¿Eliminar «' + b.title + '»? Esta acción no se puede deshacer.')) return;
  try {
    const { error } = await sb.from('books').delete().eq('id', b.id);
    if (error) throw error;
    await sb.storage.from('pdfs').remove([b.pdf_path]);
    if (b.cover_path) await sb.storage.from('covers').remove([b.cover_path]);
    toast('Libro eliminado'); await loadBooks();
  } catch (e) { toast(niceError(e), true); }
}

/* ===================== inicio ===================== */
let lastW = innerWidth;
addEventListener('resize', debounce(() => {
  if (innerWidth !== lastW){ lastW = innerWidth; renderShelf(); }
  if (R.open && R.pdf) drawPage(R.page).catch(() => {});
}, 180));

splitTitle();
ambInit();
renderShelf();
initAuth();
loadBooks().then(() => {
  const id = new URLSearchParams(location.search).get('libro');
  const b = id && S.books.find(x => String(x.id) === id);
  if (b) openBook(b, null);
});
(async () => {
  await Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), sleep(1500)]);
  await typeVerse();
  $('hero').classList.add('lit');
})();
</script>
