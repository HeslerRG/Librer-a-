<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi librería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --wall:#16211f;
  --wall-2:#1d2b28;
  --ink:#ece6d8;
  --muted:#9aa89f;
  --brass:#d2a95a;
  --wood:#6d4a2d;
  --wood-dark:#4a3020;
  --danger:#d4685a;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--wall);
  background-image:radial-gradient(ellipse at 50% -10%,#24372f 0%,transparent 60%);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

header{max-width:1100px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:8px 0 0;font-size:.95rem}
.auth-btn{background:transparent;border:1px solid #3a4b46;border-radius:999px;padding:8px 16px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.auth-btn:hover{border-color:var(--brass);color:var(--ink)}

.toolbar{max-width:1100px;margin:0 auto;padding:12px 20px 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip{background:transparent;border:1px solid #33443f;border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1b1608;font-weight:600}
.primary{background:var(--brass);color:#1b1608;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.primary:disabled{opacity:.6;cursor:wait}
.ghost{background:transparent;border:1px solid #3a4b46;border-radius:10px;padding:10px 18px}

main{max-width:1100px;margin:0 auto;padding:12px 8px 60px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.book{padding:26px 12px 0;position:relative;display:flex;flex-direction:column;align-items:center}
.book::after{
  content:"";display:block;width:calc(100% + 0px);height:16px;margin-top:14px;
  background:linear-gradient(#85603c,var(--wood) 35%,var(--wood-dark));
  box-shadow:0 8px 14px rgba(0,0,0,.35);
}
.book .cover-btn{
  width:100%;max-width:150px;aspect-ratio:2/3;border:0;padding:0;border-radius:3px 6px 6px 3px;overflow:hidden;position:relative;
  background:var(--wall-2);
  box-shadow:-3px 0 0 rgba(0,0,0,.35) inset,0 10px 18px rgba(0,0,0,.45);
  transition:transform .18s ease;
}
.book .cover-btn:hover{transform:translateY(-6px)}
.cover-btn img{width:100%;height:100%;object-fit:cover;display:block}
.fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-family:var(--serif);font-size:1.05rem;line-height:1.2;background:linear-gradient(160deg,#35503f,#1f3029);color:var(--ink)}
.meta{width:100%;max-width:150px;margin-top:10px;text-align:left}
.meta .t{font-family:var(--serif);font-size:.95rem;line-height:1.25;margin:0;overflow-wrap:anywhere}
.meta .a{color:var(--muted);font-size:.78rem;margin:2px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;width:100%;max-width:150px}
.mini{background:#22322e;border:0;border-radius:6px;padding:4px 8px;font-size:.72rem;color:var(--ink)}
.mini:hover{background:#2c403a}
.mini.del{color:var(--danger)}
.empty{max-width:420px;margin:60px auto;text-align:center;color:var(--muted);padding:0 20px;line-height:1.5}
.empty b{font-family:var(--serif);font-size:1.3rem;color:var(--ink);display:block;margin-bottom:6px;font-weight:600}

/* Modales */
.overlay{position:fixed;inset:0;background:rgba(6,10,9,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.open{display:flex}
.modal{background:var(--wall-2);border:1px solid #33443f;border-radius:14px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.modal h2{font-family:var(--serif);font-weight:600;margin:0 0 14px;font-size:1.4rem}
label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password]{width:100%;background:#121b19;border:1px solid #33443f;border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit}
input[type=file]{width:100%;font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.hint{font-size:.78rem;color:var(--muted);margin:4px 0 0}

/* Lector */
.reader{position:fixed;inset:0;background:#0d1312;z-index:30;display:none;flex-direction:column}
.reader.open{display:flex}
.reader-bar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--wall-2);border-bottom:1px solid #2c3d38}
.reader-bar h3{font-family:var(--serif);font-weight:600;font-size:1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-bar .pg{color:var(--muted);font-size:.8rem}
.pages{flex:1;overflow:auto;padding:14px 8px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-overflow-scrolling:touch}
.page{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.5);max-width:100%}
.page canvas{display:block;width:100%;height:100%}
.loading{color:var(--muted);padding:40px 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f1715;border:1px solid var(--brass);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:50;display:none;max-width:90%}
.toast.err{border-color:var(--danger)}
.toast.show{display:block}

@media (prefers-reduced-motion:reduce){.book .cover-btn{transition:none}}
</style>
</head>
<body>

<header>
  <div>
    <h1>Mi librería</h1>
    <p class="sub" id="count">Cargando…</p>
  </div>
  <button class="auth-btn" id="authBtn">Entrar</button>
</header>

<div class="toolbar">
  <div class="chips" id="chips"></div>
  <button class="primary" id="uploadBtn" style="display:none">Subir libro</button>
</div>

<main>
  <div class="shelf" id="shelf"></div>
  <div class="empty" id="empty" style="display:none"></div>
</main>

<!-- Login -->
<div class="overlay" id="loginOv">
  <div class="modal">
    <h2>Entrar</h2>
    <label for="email">Correo</label>
    <input type="email" id="email" autocomplete="username">
    <label for="pass">Contraseña</label>
    <input type="password" id="pass" autocomplete="current-password">
    <div class="row">
      <button class="ghost" data-close="loginOv">Cancelar</button>
      <button class="primary" id="loginGo">Entrar</button>
    </div>
  </div>
</div>

<!-- Subir -->
<div class="overlay" id="uploadOv">
  <div class="modal">
    <h2>Subir libro</h2>
    <label for="fTitle">Título</label>
    <input type="text" id="fTitle">
    <label for="fAuthor">Autor</label>
    <input type="text" id="fAuthor">
    <label for="fColl">Colección</label>
    <input type="text" id="fColl" list="collList" placeholder="Libros, Poemas, Cartas…">
    <datalist id="collList"></datalist>
    <label for="fPdf">Archivo PDF</label>
    <input type="file" id="fPdf" accept="application/pdf">
    <label for="fCover">Portada (opcional)</label>
    <input type="file" id="fCover" accept="image/*">
    <p class="hint">Si no eliges portada, se usa la primera página del PDF.</p>
    <div class="row">
      <button class="ghost" data-close="uploadOv">Cancelar</button>
      <button class="primary" id="uploadGo">Subir</button>
    </div>
  </div>
</div>

<!-- Lector -->
<div class="reader" id="reader">
  <div class="reader-bar">
    <h3 id="rTitle"></h3>
    <span class="pg" id="rPg"></span>
    <button class="ghost" id="rClose">Cerrar</button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<input type="file" id="coverPicker" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://yvhlqwaglphndafftyrc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qlx3etQyyZpMe4Kl_Gsh5g_lC3AAanj';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = id => document.getElementById(id);
let books = [], filter = 'Todos', user = null, coverTarget = null;

/* ---------- utilidades ---------- */
function toast(msg, err){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = 'toast', 3500);
}
const pubUrl = (bucket, path) => sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
function openOv(id){ $(id).classList.add('open'); }
function closeOv(id){ $(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeOv(b.dataset.close));
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('mousedown', e => { if (e.target === o) o.classList.remove('open'); }));

/* ---------- sesión ---------- */
async function initAuth(){
  const { data } = await sb.auth.getSession();
  setUser(data.session?.user || null);
  sb.auth.onAuthStateChange((_e, s) => setUser(s?.user || null));
}
function setUser(u){
  user = u;
  $('authBtn').textContent = u ? 'Salir' : 'Entrar';
  $('uploadBtn').style.display = u ? '' : 'none';
  render();
}
$('authBtn').onclick = async () => {
  if (user){ await sb.auth.signOut(); toast('Sesión cerrada'); }
  else openOv('loginOv');
};
$('loginGo').onclick = async () => {
  const email = $('email').value.trim(), password = $('pass').value;
  if (!email || !password) return toast('Escribe tu correo y contraseña', true);
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return toast('No se pudo entrar: ' + error.message, true);
  closeOv('loginOv'); $('pass').value = '';
  toast('Bienvenido');
};

/* ---------- datos ---------- */
async function loadBooks(){
  const { data, error } = await sb.from('books').select('*').order('created_at', { ascending:false });
  if (error){ toast('No se pudieron cargar los libros: ' + error.message, true); books = []; }
  else books = data;
  render();
}

/* ---------- vista ---------- */
function render(){
  const colls = ['Todos', ...new Set(books.map(b => b.collection).filter(Boolean))];
  if (!colls.includes(filter)) filter = 'Todos';
  const chips = $('chips'); chips.innerHTML = '';
  if (colls.length > 2){
    colls.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = c;
      b.setAttribute('aria-pressed', c === filter);
      b.onclick = () => { filter = c; render(); };
      chips.appendChild(b);
    });
  }
  $('collList').innerHTML = colls.filter(c => c !== 'Todos').map(c => `<option value="${c.replace(/"/g,'&quot;')}">`).join('');

  const list = books.filter(b => filter === 'Todos' || b.collection === filter);
  $('count').textContent = books.length
    ? `${list.length} ${list.length === 1 ? 'título' : 'títulos'}${filter !== 'Todos' ? ' en ' + filter : ''}`
    : 'Tu estante está vacío';

  const shelf = $('shelf'); shelf.innerHTML = '';
  const empty = $('empty');
  if (!list.length){
    empty.style.display = '';
    empty.innerHTML = user
      ? '<b>Aún no hay libros</b>Toca «Subir libro» para agregar tu primer PDF.'
      : '<b>Aún no hay libros</b>Vuelve pronto.';
    return;
  }
  empty.style.display = 'none';

  list.forEach(b => {
    const el = document.createElement('div'); el.className = 'book';
    const cb = document.createElement('button'); cb.className = 'cover-btn';
    cb.setAttribute('aria-label', 'Leer ' + b.title);
    if (b.cover_path){
      const img = document.createElement('img');
      img.src = pubUrl('covers', b.cover_path); img.alt = ''; img.loading = 'lazy';
      img.onerror = () => { cb.innerHTML = ''; cb.appendChild(fallback(b.title)); };
      cb.appendChild(img);
    } else cb.appendChild(fallback(b.title));
    cb.onclick = () => openReader(b);
    el.appendChild(cb);

    const meta = document.createElement('div'); meta.className = 'meta';
    const t = document.createElement('p'); t.className = 't'; t.textContent = b.title;
    meta.appendChild(t);
    if (b.author){ const a = document.createElement('p'); a.className = 'a'; a.textContent = b.author; meta.appendChild(a); }
    el.appendChild(meta);

    if (user){
      const act = document.createElement('div'); act.className = 'actions';
      act.appendChild(mini('Descargar', () => downloadBook(b)));
      act.appendChild(mini('Portada', () => { coverTarget = b; $('coverPicker').click(); }));
      const d = mini('Eliminar', () => deleteBook(b)); d.classList.add('del');
      act.appendChild(d);
      el.appendChild(act);
    }
    shelf.appendChild(el);
  });
}
function fallback(title){
  const d = document.createElement('div'); d.className = 'fallback'; d.textContent = title; return d;
}
function mini(text, fn){
  const b = document.createElement('button'); b.className = 'mini'; b.textContent = text; b.onclick = fn; return b;
}

/* ---------- lector PDF ---------- */
let readerToken = 0;
async function openReader(b){
  const token = ++readerToken;
  $('rTitle').textContent = b.title; $('rPg').textContent = '';
  const pages = $('pages'); pages.innerHTML = '<div class="loading">Abriendo…</div>';
  $('reader').classList.add('open'); document.body.style.overflow = 'hidden';
  try{
    const pdf = await pdfjsLib.getDocument({ url: pubUrl('pdfs', b.pdf_path) }).promise;
    if (token !== readerToken) return;
    pages.innerHTML = '';
    const first = await pdf.getPage(1);
    const avail = Math.min(pages.clientWidth - 16, 900);
    const base = first.getViewport({ scale: 1 });
    const cssW = Math.max(200, avail);
    const ratio = base.height / base.width;
    $('rPg').textContent = pdf.numPages + (pdf.numPages === 1 ? ' página' : ' páginas');

    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        const holder = en.target;
        if (holder.dataset.done) return;
        holder.dataset.done = '1';
        renderPage(pdf, +holder.dataset.n, holder, cssW, token);
      });
    }, { root: pages, rootMargin: '600px 0px' });

    for (let n = 1; n <= pdf.numPages; n++){
      const h = document.createElement('div');
      h.className = 'page'; h.dataset.n = n;
      h.style.width = cssW + 'px'; h.style.height = Math.round(cssW * ratio) + 'px';
      pages.appendChild(h); io.observe(h);
    }
    pages.scrollTop = 0;
  }catch(e){
    pages.innerHTML = '<div class="loading">No se pudo abrir el PDF.</div>';
  }
}
async function renderPage(pdf, n, holder, cssW, token){
  if (token !== readerToken) return;
  const page = await pdf.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vp = page.getViewport({ scale: (cssW / base.width) * dpr });
  const c = document.createElement('canvas');
  c.width = vp.width; c.height = vp.height;
  holder.style.height = Math.round(cssW * base.height / base.width) + 'px';
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  if (token === readerToken) holder.appendChild(c);
}
function closeReader(){
  readerToken++;
  $('reader').classList.remove('open'); $('pages').innerHTML = '';
  document.body.style.overflow = '';
}
$('rClose').onclick = closeReader;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('reader').classList.contains('open')) closeReader(); });

/* ---------- subir ---------- */
$('uploadBtn').onclick = () => {
  ['fTitle','fAuthor','fPdf','fCover'].forEach(i => $(i).value = '');
  $('fColl').value = filter !== 'Todos' ? filter : '';
  openOv('uploadOv');
};
$('fPdf').onchange = () => {
  const f = $('fPdf').files[0];
  if (f && !$('fTitle').value) $('fTitle').value = f.name.replace(/\.pdf$/i, '');
};
async function coverFromPdf(file){
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const page = await pdf.getPage(1);
  const base = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: 600 / base.width });
  const c = document.createElement('canvas');
  c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
}
const extOf = f => (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';

$('uploadGo').onclick = async () => {
  const title = $('fTitle').value.trim();
  const pdf = $('fPdf').files[0], cover = $('fCover').files[0];
  if (!title) return toast('Escribe un título', true);
  if (!pdf) return toast('Elige un archivo PDF', true);
  const btn = $('uploadGo'); btn.disabled = true; btn.textContent = 'Subiendo…';
  const id = crypto.randomUUID();
  const pdfPath = id + '.pdf';
  let coverPath = null;
  try{
    let up = await sb.storage.from('pdfs').upload(pdfPath, pdf, { contentType: 'application/pdf' });
    if (up.error) throw up.error;

    let coverBlob = cover, coverType = cover?.type;
    let ext = cover ? extOf(cover) : 'jpg';
    if (!coverBlob){
      try{ coverBlob = await coverFromPdf(pdf); coverType = 'image/jpeg'; }catch(_){ coverBlob = null; }
    }
    if (coverBlob){
      coverPath = id + '.' + ext;
      const uc = await sb.storage.from('covers').upload(coverPath, coverBlob, { contentType: coverType || 'image/jpeg' });
      if (uc.error){ coverPath = null; }
    }
    const { error } = await sb.from('books').insert({
      title, author: $('fAuthor').value.trim() || null,
      collection: $('fColl').value.trim() || 'Libros',
      pdf_path: pdfPath, cover_path: coverPath
    });
    if (error){
      await sb.storage.from('pdfs').remove([pdfPath]);
      if (coverPath) await sb.storage.from('covers').remove([coverPath]);
      throw error;
    }
    closeOv('uploadOv'); toast('Libro subido');
    await loadBooks();
  }catch(e){
    toast('No se pudo subir: ' + (e.message || e), true);
  }finally{
    btn.disabled = false; btn.textContent = 'Subir';
  }
};

/* ---------- portada, descargar, eliminar ---------- */
$('coverPicker').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !coverTarget) return;
  const b = coverTarget; coverTarget = null;
  try{
    const path = crypto.randomUUID() + '.' + extOf(f);
    const u = await sb.storage.from('covers').upload(path, f, { contentType: f.type || 'image/jpeg' });
    if (u.error) throw u.error;
    const { error } = await sb.from('books').update({ cover_path: path }).eq('id', b.id);
    if (error) throw error;
    if (b.cover_path) await sb.storage.from('covers').remove([b.cover_path]);
    toast('Portada actualizada');
    await loadBooks();
  }catch(err){ toast('No se pudo cambiar la portada: ' + (err.message || err), true); }
};

async function downloadBook(b){
  try{
    toast('Preparando descarga…');
    const r = await fetch(pubUrl('pdfs', b.pdf_path));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement('a');
    a.href = url; a.download = b.title.replace(/[\\/:*?"<>|]/g, '') + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }catch(e){ toast('No se pudo descargar: ' + e.message, true); }
}

async function deleteBook(b){
  if (!confirm('¿Eliminar «' + b.title + '»? Esta acción no se puede deshacer.')) return;
  try{
    const { error } = await sb.from('books').delete().eq('id', b.id);
    if (error) throw error;
    await sb.storage.from('pdfs').remove([b.pdf_path]);
    if (b.cover_path) await sb.storage.from('covers').remove([b.cover_path]);
    toast('Libro eliminado');
    await loadBooks();
  }catch(e){ toast('No se pudo eliminar: ' + (e.message || e), true); }
}

/* ---------- inicio ---------- */
initAuth();
loadBooks();
</script>
</body>
</html>
