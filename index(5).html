  const author = $('fAuthor').value.trim() || null, collection = $('fColl').value.trim() || 'Libros';
  const btn = $('bookGo'), editing = S.editing;
  if (!editing && !$('fPdf').files[0]) return toast('Elige un archivo PDF', true);
  btn.disabled = true; btn.textContent = editing ? 'Guardando…' : 'Subiendo…';
  try {
    if (editing){
      const { error } = await sb.from('books').update({ title, author, collection }).eq('id', editing.id);
      if (error) throw error;
      closeOv('bookOv'); toast('Cambios guardados');
    } else {
      await uploadBook({ title, author, collection, pdf: $('fPdf').files[0], cover: $('fCover').files[0] });
      closeOv('bookOv'); toast('Libro subido');
    }
    await loadBooks();
  } catch (e) { toast(niceError(e), true); }
  finally { btn.disabled = false; btn.textContent = editing ? 'Guardar' : 'Subir'; }
};

/* ===================== portada, descargar, eliminar ===================== */
$('coverPicker').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  const b = S.coverTarget; S.coverTarget = null;
  if (!f || !b) return;
  try {
    toast('Cambiando la portada…');
    const path = crypto.randomUUID() + '.' + extOf(f);
    const u = await sb.storage.from('covers').upload(path, f, { contentType: f.type || 'image/jpeg' });
    if (u.error) throw u.error;
    const { error } = await sb.from('books').update({ cover_path: path }).eq('id', b.id);
    if (error) throw error;
    if (b.cover_path) await sb.storage.from('covers').remove([b.cover_path]);
    toast('Portada actualizada'); await loadBooks();
  } catch (err) { toast(niceError(err), true); }
};
async function downloadBook(b){
  try {
    toast('Preparando la descarga…');
    const r = await fetch(pubUrl('pdfs', b.pdf_path));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    const a = el('a'); a.href = url; a.download = (b.title || 'libro').replace(/[\\/:*?"<>|]/g, '') + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 6000);
  } catch (e) { toast('No se pudo descargar: ' + e.message, true); }
}
async function deleteBook(b){
  if (!confirm('¿Eliminar «' + b.title + '»? Esta acción no se puede deshacer.')) return;
  try {
    const { error } = await sb.from('books').delete().eq('id', b.id);
    if (error) throw error;
    await sb.storage.from('pdfs').remove([b.pdf_path]);
    if (b.cover_path) await sb.storage.from('covers').remove([b.cover_path]);
    toast('Libro eliminado'); await loadBooks();
  } catch (e) { toast(niceError(e), true); }
}

/* ===================== utilidades de memoria local ===================== */
function ls(k, v){
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) { return null; }
}

/* ===================== modo noche: la vela ===================== */
const N = { on: false, placed: false, cx: 0, cy: 0, lx: 0, ly: 0, R: 420, raf: 0, t: 0, last: 0, drag: null,
  sway: 0, gust: 0, books: [], chars: [], targets: [], qt: 0, sceneT: 0, outTimer: 0, el: null, flame: null };
const rootEl = document.documentElement;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const falloff = x => x >= 1 ? 0 : Math.pow(1 - x, 1.8);
const calcR = () => clamp(.62 * Math.max(innerWidth, innerHeight), 300, 600);
function setV(e, k, v){
  const c = e._nv || (e._nv = {});
  if (c[k] === v) return;
  c[k] = v; e.style.setProperty(k, v);
}
function setCandle(x, y){
  N.cx = clamp(x, 26, innerWidth - 26);
  N.cy = clamp(y, 30, Math.max(60, innerHeight - 100));
  N.el.style.transform = `translate3d(${(N.cx - 32).toFixed(1)}px,${(N.cy - 16).toFixed(1)}px,0)`;
}
function placeCandle(){
  const host = R.open ? $('reader') : document.body;
  if (N.el.parentNode !== host) host.appendChild(N.el);
}
function paintLights(){
  const lb = $('lightsBtn'), rb = $('rLights');
  const label = N.on ? 'Encender las luces' : 'Apagar las luces';
  lb.innerHTML = (N.on ? ICON.bulb : ICON.moon) + '<span class="lbl">' + (N.on ? 'Encender luz' : 'Apagar luces') + '</span>';
  rb.innerHTML = N.on ? ICON.bulb : ICON.moon;
  [lb, rb].forEach(b => { b.setAttribute('aria-pressed', String(N.on)); b.setAttribute('aria-label', label); b.title = label; });
}
function litScene(Rl){
  const now = performance.now();
  if (now - N.qt > 600){
    N.books = [...document.querySelectorAll('.book')];
    N.chars = [...document.querySelectorAll('#title .ch')];
    N.qt = now;
  }
  const lx = N.lx, ly = N.ly, vh = innerHeight;
  const br = N.books.map(b => b.getBoundingClientRect());
  const cr = N.chars.map(c => c.getBoundingClientRect());
  const tr = N.targets.map(t => t.getBoundingClientRect());
  N.books.forEach((b, i) => {
    const r = br[i];
    if (r.bottom < -200 || r.top > vh + 200){ setV(b, '--lit', '0.00'); return; }
    const mx = r.left + r.width / 2, my = r.top + r.height / 2, d = Math.hypot(mx - lx, my - ly);
    setV(b, '--lit', clamp(falloff(d / Rl) * 1.1, 0, 1).toFixed(2));
    setV(b, '--hx', clamp((lx - r.left) / r.width * 100, -30, 130).toFixed(0) + '%');
    setV(b, '--hy', clamp((ly - r.top) / r.height * 100, -30, 130).toFixed(0) + '%');
    setV(b, '--sx', clamp((mx - lx) / (Rl * .55), -1, 1).toFixed(2));
    setV(b, '--sa', Math.min(1, d / (Rl * .6)).toFixed(2));
  });
  N.chars.forEach((c, i) => {
    const r = cr[i];
    setV(c, '--cl', falloff(Math.hypot(r.left + r.width / 2 - lx, r.top + r.height / 2 - ly) / (Rl * 1.1)).toFixed(2));
  });
  N.targets.forEach((t, i) => {
    const r = tr[i];
    setV(t, '--tl', falloff(Math.hypot(r.left + r.width / 2 - lx, r.top + r.height / 2 - ly) / (Rl * 1.1)).toFixed(2));
  });
}
function nightFrame(t){
  N.raf = requestAnimationFrame(nightFrame);
  const dt = N.t ? Math.min(64, t - N.t) : 16; N.t = t;
  const ex = N.cx - N.lx, ey = N.cy - N.ly;
  const k = reduced ? 1 : 1 - Math.exp(-dt / 90);
  N.lx += ex * k; N.ly += ey * k;
  const moving = !!N.drag || Math.abs(ex) + Math.abs(ey) > .5;
  if (!moving && t - N.last < (reduced ? 1e9 : 66)) return;
  N.last = t;
  let rf = 1, fl = 1;
  if (!reduced){
    if (Math.random() < .012) N.gust = .16 + Math.random() * .22;
    N.gust *= .9;
    fl = clamp(.91 + .05 * Math.sin(t * .013) + .035 * Math.sin(t * .031 + 1) - N.gust, .55, 1.05);
    rf = 1 + .03 * Math.sin(t * .011) + .02 * Math.sin(t * .027 + .7) - N.gust * .12;
  }
  const Rl = N.R * rf, st = rootEl.style;
  st.setProperty('--cx', N.lx.toFixed(1) + 'px');
  st.setProperty('--cy', N.ly.toFixed(1) + 'px');
  st.setProperty('--r', Rl.toFixed(1) + 'px');
  st.setProperty('--fl', fl.toFixed(3));
  const target = reduced ? 0 : clamp(-ex * .45, -26, 26) + Math.sin(t * .0075) * 1.8 - N.gust * 10;
  N.sway += (target - N.sway) * .3;
  N.flame.style.setProperty('--sway', N.sway.toFixed(1));
  if (!R.open && (moving || t - N.sceneT > 320)){ N.sceneT = t; litScene(Rl); }
}
function startNight(){ if (!N.raf && !document.hidden){ N.t = 0; N.raf = requestAnimationFrame(nightFrame); } }
function stopNight(){ cancelAnimationFrame(N.raf); N.raf = 0; }
function setNight(on, silent){
  if (on === N.on) return;
  N.on = on;
  clearTimeout(N.outTimer);
  document.body.classList.toggle('night', on);
  Amb.boost = on ? 2.4 : 1;
  const v = N.el;
  if (on){
    if (!N.placed){ N.cx = innerWidth / 2; N.cy = innerHeight * .62; N.lx = N.cx; N.ly = N.cy; N.placed = true; }
    N.R = calcR();
    if ($('note').classList.contains('show')) hideNote();
    placeCandle(); setCandle(N.cx, N.cy);
    v.classList.remove('out'); v.classList.add('on');
    startNight();
    if (!silent) toast('Buenas noches. Arrastra la vela para iluminar.');
  } else {
    v.classList.remove('on'); v.classList.add('out');
    N.outTimer = setTimeout(() => { v.classList.remove('out'); if (!N.on) stopNight(); }, 1900);
    if (!silent) toast('Luces encendidas');
    setTimeout(maybeAnnounce, 2200);
  }
  paintLights();
}
function initNight(){
  N.el = $('vela'); N.flame = $('vFlame');
  N.targets = [document.querySelector('.lib-head h2')].filter(Boolean);
  N.el.addEventListener('pointerdown', e => {
    if (!N.on) return;
    e.preventDefault();
    try { N.el.setPointerCapture(e.pointerId); } catch (_) {}
    N.drag = { id: e.pointerId, ox: e.clientX - N.cx, oy: e.clientY - N.cy };
    N.el.classList.add('drag');
  });
  N.el.addEventListener('pointermove', e => {
    if (!N.drag || e.pointerId !== N.drag.id) return;
    setCandle(e.clientX - N.drag.ox, e.clientY - N.drag.oy);
  });
  const endDrag = e => {
    if (N.drag && (!e || e.pointerId === N.drag.id)){ N.drag = null; N.el.classList.remove('drag'); }
  };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => N.el.addEventListener(ev, endDrag));
  N.el.addEventListener('keydown', e => {
    const s = e.shiftKey ? 90 : 30;
    const m = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] }[e.key];
    if (!m) return;
    e.preventDefault(); setCandle(N.cx + m[0], N.cy + m[1]);
  });
  addEventListener('resize', debounce(() => { N.R = calcR(); if (N.placed) setCandle(N.cx, N.cy); }, 150));
  document.addEventListener('visibilitychange', () => {
    if (!N.on) return;
    if (document.hidden) stopNight(); else startNight();
  });
  paintLights();
}

/* ===================== nota flotante ===================== */
let noteOnDismiss = null;
function setNoteBtn(btn, cfg){
  btn.hidden = !cfg;
  if (cfg){ btn.textContent = cfg.label; btn.onclick = cfg.fn; }
}
function showNote({ kicker, text, title, primary, secondary, onDismiss }){
  $('nKicker').textContent = kicker; $('nText').textContent = text;
  $('nTitle').textContent = title || ''; $('nTitle').hidden = !title;
  setNoteBtn($('nPrimary'), primary); setNoteBtn($('nSecondary'), secondary);
  noteOnDismiss = onDismiss || null;
  $('note').classList.add('show');
}
function hideNote(){
  $('note').classList.remove('show');
  if (noteOnDismiss){ const f = noteOnDismiss; noteOnDismiss = null; f(); }
}
$('nClose').onclick = hideNote;

/* ===================== algo nuevo por leer ===================== */
let litDone = false, announced = false;
function isNew(b){ return !!b.created_at && (Date.now() - new Date(b.created_at).getTime()) < DIAS_NOVEDAD * 864e5; }
function kindOf(b){
  const c = (b.collection || '').toLowerCase();
  if (c.includes('poem')) return 'un nuevo poema';
  if (c.includes('carta')) return 'una nueva carta';
  if (c.includes('cuento')) return 'un nuevo cuento';
  return 'un nuevo libro';
}
function maybeAnnounce(){
  if (announced || !S.loaded || R.open || N.on) return;
  const fresh = S.books.filter(b => isNew(b) && !ls('leido:' + b.id) &&
    Date.now() - (parseInt(ls('aviso-visto:' + b.id), 10) || 0) > 20 * 3600e3);
  if (!fresh.length) return;
  announced = true;
  const first = fresh[0], many = fresh.length > 1;
  const names = fresh.slice(0, 2).map(b => '«' + b.title + '»').join(' y ') + (fresh.length > 2 ? ` y ${fresh.length - 2} más` : '');
  showNote({
    kicker: 'Recién llegado al estante',
    text: many ? `Hay ${fresh.length} páginas nuevas que me encantaría que leyeras` : `Hay ${kindOf(first)} que me encantaría que leyeras`,
    title: many ? names : '«' + first.title + '»',
    primary: { label: many ? 'Leer el más reciente' : 'Leer ahora', fn: () => { hideNote(); openBook(first, null); } },
    secondary: { label: many ? 'Ver en el estante' : 'Después', fn: () => { hideNote(); if (many) $('library').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }); } },
    onDismiss: () => fresh.forEach(b => ls('aviso-visto:' + b.id, String(Date.now())))
  });
}

/* ===================== avisos al teléfono ===================== */
const AV = {
  supported: 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!AVISOS_CLAVE_PUBLICA,
  reg: null, sub: null
};
function b64ToU8(str){
  const pad = '='.repeat((4 - str.length % 4) % 4);
  const raw = atob((str + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
function avisosOn(){ return !!AV.sub && Notification.permission === 'granted'; }
function updateBell(){
  const b = $('bellBtn'), on = avisosOn();
  b.innerHTML = on ? ICON.bellOn : ICON.bell;
  b.setAttribute('aria-pressed', String(on));
  b.setAttribute('aria-label', on ? 'Desactivar los avisos' : 'Avisarme de nuevos poemas');
}
async function initAvisos(){
  if (!AV.supported) return;
  try {
    AV.reg = await navigator.serviceWorker.register('sw.js');
    AV.sub = await AV.reg.pushManager.getSubscription();
  } catch (_) { AV.supported = false; return; }
  $('bellBtn').hidden = false; updateBell();
}
async function toggleAvisos(){
  if (!AV.supported || !AV.reg) return toast('Este navegador no permite avisos', true);
  try {
    if (avisosOn()){
      const ep = AV.sub.endpoint;
      await AV.sub.unsubscribe(); AV.sub = null;
      await sb.rpc('quitar_aviso', { p_endpoint: ep });
      updateBell(); toast('Avisos desactivados'); return;
    }
    if (Notification.permission === 'denied')
      return toast('Los avisos están bloqueados. Actívalos en los ajustes del sitio de tu navegador.', true);
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('No se activaron los avisos', true);
    if (!AV.sub) AV.sub = await AV.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(AVISOS_CLAVE_PUBLICA) });
    const j = AV.sub.toJSON();
    const { error } = await sb.from('avisos').insert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
    if (error && error.code !== '23505') throw error;
    ls('avisos-invitado', '1'); updateBell();
    toast('Listo. Te avisaré cuando haya algo nuevo que leer.');
  } catch (e) { toast('No se pudieron activar los avisos: ' + (e.message || e), true); }
}
$('bellBtn').onclick = toggleAvisos;
function maybeInviteAvisos(){
  if (!AV.supported || !AV.reg || avisosOn() || S.user || R.open || N.on || ls('avisos-invitado') || $('note').classList.contains('show')) return;
  ls('avisos-invitado', '1');
  showNote({
    kicker: '¿Te aviso?',
    text: 'Cuando suba un poema o un libro nuevo, puedo avisarte en tu teléfono.',
    primary: { label: 'Avisarme', fn: () => { hideNote(); toggleAvisos(); } },
    secondary: { label: 'Ahora no', fn: hideNote }
  });
}

/* ===================== inicio ===================== */
let lastW = innerWidth;
addEventListener('resize', debounce(() => {
  if (innerWidth !== lastW){ lastW = innerWidth; renderShelf(); }
  if (R.open && R.pdf) drawPage(R.page).catch(() => {});
}, 180));

splitTitle();
ambInit();
initNight();
renderShelf();
initAuth();
initAvisos();
loadBooks().then(() => {
  const id = new URLSearchParams(location.search).get('libro');
  const b = id && S.books.find(x => String(x.id) === id);
  if (b) openBook(b, null);
});
(async () => {
  await Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), sleep(1500)]);
  await typeVerse();
  $('hero').classList.add('lit');
  setTimeout(() => { litDone = true; maybeAnnounce(); }, reduced ? 300 : 2800);
})();
</script>
